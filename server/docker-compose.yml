# The Tainted World: the game's dedicated server, beside the estate's applications on 192.168.86.18.
# Brought up by deploy_server.ps1 (run on the development PC), from /opt/projects/Tainted/server.
#
# Public: games join wss://tainted.xandflix.uk (first in the project setting tainted/net/world_addresses):
# Cloudflare, then the estate's Traefik (its tainted-public router, in the estate repository's
# traefik/dynamic.yml), which reaches this container on the shared `arr` network as http://tainted:24601.
#
# LAN: port 24601 is also published on the host, so a game on the home network can join
# ws://192.168.86.18:24601 (the second address it tries). The router doesn't forward it.
services:
  tainted:
    build: .
    image: tainted-server
    container_name: tainted
    restart: unless-stopped
    environment:
      - TAINTED_NAME=${TAINTED_NAME:-Tainted World}
      - TAINTED_MAX=${TAINTED_MAX:-32}
      # Require an Autharr sign-in, checked over the arr network (Autharr has the tainted-game client).
      # Set TAINTED_AUTH= (empty) to run without it: device keys as accounts.
      - TAINTED_AUTH=${TAINTED_AUTH-http://autharr:5180}
      # Told to a game too old to join (publish_builds.ps1 puts the builds there)
      - "TAINTED_UPDATE=${TAINTED_UPDATE-Get the new version from the NAS: Tainted > builds (Tainted.apk on a phone, Tainted.exe on a PC).}"
      # Seconds' warning players get when the container stops (a redeploy, docker stop)
      - TAINTED_STOP_WARNING=${TAINTED_STOP_WARNING:-10}
      # TestBot's way in (see tainted-bot below; empty: no bots)
      - TAINTED_BOT_KEY=${TAINTED_BOT_KEY:-}
    # Time for that warning and the saving after it before Docker kills it
    stop_grace_period: 30s
    ports:
      - "24601:24601"   # LAN only: not forwarded on the router
    volumes:
      # The players' characters, one JSON file per account, with 7 days of daily backups
      # (data/backups). Beside the estate's other application data.
      - ${TAINTED_DATA:-/appdata/estate/tainted}:/data
    networks:
      - arr
    # A ceiling, so a flood can't starve the estate's applications.
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TestBot: a player to try multiplayer with on your own (scripts/bots/test_bot.gd: whisper it "help").
  # It comes in with the bot key instead of a sign-in: TAINTED_BOT_KEY, in .env beside this file
  # (deploy_server.ps1 makes it once; it's not in git). The server lets that key in, and only that.
  tainted-bot:
    image: tainted-server
    pull_policy: never
    container_name: tainted-bot
    restart: unless-stopped
    depends_on:
      - tainted
    environment:
      - TAINTED_BOT_KEY=${TAINTED_BOT_KEY:-}
    command: ["sh", "-c", "exec godot --headless --main-pack /game/tainted.pck res://scenes/test_bot.tscn -- --addr=ws://tainted:24601 --bot-key=\"$$TAINTED_BOT_KEY\" --name=TestBot"]
    healthcheck:
      disable: true
    networks:
      - arr
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  arr:
    external: true
    name: arr

# Tainted's download page and the two game files, behind Traefik (tainted.xandflix.uk/download).
# Static files only: nothing here talks to the game server.

# At most 3 downloads at once per visitor (the address Cloudflare saw), so one machine can't hold the
# line open for the whole estate.
limit_conn_zone $http_cf_connecting_ip zone=perip:1m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirects stay relative: nginx sees plain http from Traefik and would send people to http://
    absolute_redirect off;

    root /usr/share/nginx/html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;

    location = /download { return 301 /download/; }

    location = /download/ {
        try_files /download/index.html =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /download/files/ {
        limit_conn perip 3;
        # A new release replaces the files in place: let the edge keep them a short while, no longer.
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / { return 404; }
}
